
name: Build APEX DUEL APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract game ZIP
        run: |
          mkdir project
          unzip -q apex-duel-github-upload.zip -d project

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Capacitor
        working-directory: project
        run: |
          npm install
          npm install @capacitor/core @capacitor/android
          npm install -D @capacitor/cli
          npx cap init "APEX DUEL" com.apexduel.ultimate --web-dir dist
          npm run build
          npx cap add android
          npx cap sync android

      - name: Build APK
        working-directory: project/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APEX-DUEL-APK
          path: project/android/app/build/outputs/apk/debug/app-debug.apk
